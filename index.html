<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huffman File Compressor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Huffman File Compressor</h1>
        <p>Lossless file compression using Huffman Coding</p>
        <div class="box">
            <input type="file" id="fileInput">
            <div class="buttons">
                <button onclick="processFile('compress')">Compress</button>
                <button onclick="processFile('decompress')">Decompress</button>
            </div>
            <p id="status"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
